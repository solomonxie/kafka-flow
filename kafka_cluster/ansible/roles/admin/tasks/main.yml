---
- name: Update apt cache and install Java JRE & dependencies
  ansible.builtin.apt:
    name:
      - openjdk-17-jre-headless
      - wget
      - tar
    state: present
    update_cache: true

- name: Download Apache Kafka {{ kafka_version }} tarball
  ansible.builtin.get_url:
    url: "https://downloads.apache.org/kafka/{{ kafka_version }}/kafka_{{ scala_version }}-{{ kafka_version }}.tgz"
    dest: "/tmp/kafka.tgz"
    mode: "0644"

- name: Create installation directory
  ansible.builtin.file:
    path: "{{ kafka_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Extract Kafka archive to {{ kafka_dir }}
  ansible.builtin.unarchive:
    src: "/tmp/kafka.tgz"
    dest: "{{ kafka_dir }}"
    remote_src: true
    extra_opts: ["--strip-components=1"]
    owner: ubuntu
    group: ubuntu
    creates: "{{ kafka_dir }}/bin/kafka-server-start.sh"

- name: Ensure combined broker+controller KRaft mode
  ansible.builtin.lineinfile:
    path: "{{ kafka_dir }}/config/server.properties"
    regexp: '^#?process\.roles='
    line: "process.roles=broker,controller"

- name: Remove default dynamic-quorum bootstrap line (we use a static quorum instead)
  ansible.builtin.lineinfile:
    path: "{{ kafka_dir }}/config/server.properties"
    regexp: '^#?controller\.quorum\.bootstrap\.servers='
    state: absent

- name: Compute controller quorum voters string from all kafka_brokers hosts
  ansible.builtin.set_fact:
    kafka_quorum_voters: "{% for h in groups['kafka_brokers'] %}{{ hostvars[h].node_id }}@{{ hostvars[h].ansible_host }}:9093{% if not loop.last %},{% endif %}{% endfor %}"

- name: Configure node identity, static quorum voters, listeners and data directory
  ansible.builtin.lineinfile:
    path: "{{ kafka_dir }}/config/server.properties"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^#?node\.id=', line: 'node.id={{ node_id }}' }
    - { regexp: '^#?controller\.quorum\.voters=', line: 'controller.quorum.voters={{ kafka_quorum_voters }}' }
    - { regexp: '^#?listeners=', line: 'listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093' }
    - { regexp: '^#?advertised\.listeners=', line: 'advertised.listeners=PLAINTEXT://{{ ansible_host }}:9092' }
    - { regexp: '^#?log\.dirs=', line: 'log.dirs={{ kafka_data_dir }}' }
  loop_control:
    label: "{{ item.regexp }}"

- name: Create Kafka log storage directory
  ansible.builtin.file:
    path: "{{ kafka_data_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Check if KRaft log directory is formatted
  ansible.builtin.stat:
    path: "{{ kafka_data_dir }}/meta.properties"
  register: kraft_meta

- name: Format KRaft storage log directory (multi-node quorum)
  ansible.builtin.command:
    cmd: "{{ kafka_dir }}/bin/kafka-storage.sh format -t {{ kafka_cluster_id }} -c {{ kafka_dir }}/config/server.properties"
  when: not kraft_meta.stat.exists

- name: Ensure all Kafka data files are owned by ubuntu user
  ansible.builtin.file:
    path: "{{ kafka_data_dir }}"
    owner: ubuntu
    group: ubuntu
    recurse: true

- name: Create Systemd service definition for Kafka
  ansible.builtin.copy:
    dest: /etc/systemd/system/kafka.service
    mode: "0644"
    content: |
      [Unit]
      Description=Apache Kafka Distributed Message Broker (KRaft)
      After=network.target

      [Service]
      Type=simple
      User=ubuntu
      Group=ubuntu
      Environment="KAFKA_HEAP_OPTS={{ kafka_heap_opts }}"
      ExecStart={{ kafka_dir }}/bin/kafka-server-start.sh {{ kafka_dir }}/config/server.properties
      ExecStop={{ kafka_dir }}/bin/kafka-server-stop.sh
      Restart=on-failure
      LimitNOFILE=65536
      MemoryHigh={{ kafka_service_memory_high }}
      MemoryMax={{ kafka_service_memory_max }}

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd daemon and start Kafka service
  ansible.builtin.systemd:
    name: kafka
    daemon_reload: true
    state: started
    enabled: true

- name: Wait for Kafka broker to listen on port 9092
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 9092
    delay: 3
    timeout: 30
